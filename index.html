<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="adamfavi.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script
  defer
  data-website-id="dfid_oiqgFcVBhEReTvrQfYLwf"

<style>
    :root {
        --ink: #dfeef0;
        --dim: #7d979b;
        --teal: #37f2ff;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #010203;
    }
    body {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
    }
    canvas#relic {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
    body.no-webgl {
        background:
            radial-gradient(ellipse 90% 60% at 50% 110%, rgba(20, 70, 78, 0.35), transparent 70%),
            radial-gradient(ellipse 60% 45% at 50% 40%, rgba(10, 24, 27, 0.8), transparent 75%),
            #010203;
    }
    ::selection { background: rgba(55, 242, 255, 0.18); color: #eafcff; }

    .card {
        position: fixed;
        z-index: 2;
        left: clamp(28px, 9vw, 140px);
        top: 50%;
        transform: translateY(-50%);
        max-width: 440px;
    }
    h1 {
        margin: 0 0 26px;
        font-size: clamp(1.5rem, 3.2vw, 2.1rem);
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: 0 0 28px rgba(55, 242, 255, 0.1);
        white-space: nowrap;
    }
    .glitch { position: relative; display: inline-block; }
    .glitch::before, .glitch::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
    }
    .glitch::before { color: var(--teal); animation: gA 9.5s infinite steps(1, end); }
    .glitch::after  { color: rgba(190, 225, 255, 0.8); animation: gB 13s infinite steps(1, end); }
    @keyframes gA {
        0%, 96%   { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
        96.4%     { opacity: 0.45; transform: translate(-1px, 0); clip-path: inset(12% 0 64% 0); }
        97.2%     { opacity: 0.45; transform: translate(1px, 0);  clip-path: inset(66% 0 8% 0); }
        98%, 100% { opacity: 0; }
    }
    @keyframes gB {
        0%, 97.4%  { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
        97.8%      { opacity: 0.35; transform: translate(1px, 0);  clip-path: inset(48% 0 30% 0); }
        98.6%, 100%{ opacity: 0; }
    }
    .rule {
        width: 42px;
        height: 1px;
        background: rgba(55, 242, 255, 0.35);
        margin: 0 0 26px;
    }
    .line {
        margin: 0 0 10px;
        font-size: 0.8rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        color: var(--dim);
    }
    .line a {
        color: #b9d5d9;
        text-decoration: none;
        border-bottom: 1px solid rgba(55, 242, 255, 0.22);
        transition: color 0.25s ease, border-color 0.25s ease;
    }
    .line a:hover {
        color: var(--teal);
        border-color: var(--teal);
    }

    .card > * { opacity: 0; animation: rise 1.1s cubic-bezier(0.2, 0.6, 0.2, 1) forwards; }
    .card > *:nth-child(1) { animation-delay: 0.25s; }
    .card > *:nth-child(2) { animation-delay: 0.45s; }
    .card > *:nth-child(3) { animation-delay: 0.6s; }
    .card > *:nth-child(4) { animation-delay: 0.72s; }
    @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
    }

    @media (max-width: 760px) {
        .card {
            left: 28px;
            right: 28px;
            top: auto;
            bottom: 11vh;
            transform: none;
            max-width: none;
        }
        h1 { letter-spacing: 0.18em; }
    }

    @media (prefers-reduced-motion: reduce) {
        .glitch::before, .glitch::after { animation: none; }
        .card > * { animation: none; opacity: 1; }
    }
</style>
</head>
<body>
    <canvas id="relic" aria-hidden="true"></canvas>

    <main class="card" aria-label="About Adam Senese">
        <h1><span class="glitch" data-text="Adam Senese">Adam Senese</span></h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="line">Co-founder of <a href="https://relative.dev">Relative.dev</a></p>
    </main>

<script>
(function () {
    'use strict';
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('relic');
    var gl = canvas.getContext('webgl', { antialias: false, alpha: false })
          || canvas.getContext('experimental-webgl');
    if (!gl) { document.body.classList.add('no-webgl'); }

    var VERT = [
        'attribute vec2 aPos;',
        'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
    ].join('\n');

    var SCENE_FRAG = [
        'precision highp float;',
        'uniform vec2 uRes;',
        'uniform float uTime;',
        'uniform vec2 uMouse;',
        'uniform vec2 uShift;',
        'uniform float uDist;',
        'uniform float uTear;',

        'float hash11(float p){ p = fract(p * 443.8975); p *= p + 7.13; p *= p + p; return fract(p); }',
        'float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 443.897); p3 += dot(p3, p3.yzx + 19.19); return fract((p3.x + p3.y) * p3.z); }',
        'float vnoise(vec2 p){',
        '    vec2 i = floor(p), f = fract(p);',
        '    f = f * f * (3.0 - 2.0 * f);',
        '    float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));',
        '    float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));',
        '    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
        '}',
        'float fbm(vec2 p){',
        '    float s = 0.0, a = 0.5;',
        '    for (int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }',
        '    return s;',
        '}',
        'vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }',

        'vec3 localDir(vec3 v){',
        '    v.xz = rot(v.xz, -(uTime * 0.16 + uMouse.x * 0.5));',
        '    v.yz = rot(v.yz, -(0.05 * sin(uTime * 0.13) + uMouse.y * 0.2));',
        '    return v;',
        '}',
        'vec3 toLocal(vec3 p){',
        '    p.y -= 0.10 * sin(uTime * 0.4);',
        '    return localDir(p);',
        '}',
        'float sdRoundBox(vec3 p, vec3 b, float r){',
        '    vec3 q = abs(p) - b;',
        '    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;',
        '}',
        'float sdShard(vec3 p, float rad, float sp, float yy, float ph, vec3 sz){',
        '    float a = uTime * sp + ph;',
        '    vec3 c = vec3(cos(a) * rad, yy + 0.08 * sin(uTime * 0.6 + ph), sin(a) * rad);',
        '    vec3 q = p - c;',
        '    q.xy = rot(q.xy, uTime * 0.6 + ph);',
        '    q.yz = rot(q.yz, uTime * 0.4 + ph * 1.7);',
        '    return sdRoundBox(q, sz, 0.012);',
        '}',
        'float map(vec3 p){',
        '    vec3 q = toLocal(p);',
        '    q.x += (hash11(floor((q.y + 10.0) * 22.0) + floor(uTime * 28.0) * 0.317) - 0.5) * uTear * 0.22;',
        '    float d = sdRoundBox(q, vec3(0.58, 1.30, 0.15), 0.025);',
        '    d = max(d, -(length(q - vec3(0.52, 1.24, 0.0)) - 0.30));',
        '    d = min(d, sdShard(p, 1.35,  0.21,  0.55, 0.0, vec3(0.05, 0.11, 0.03)));',
        '    d = min(d, sdShard(p, 1.70, -0.13, -0.35, 2.1, vec3(0.08, 0.05, 0.03)));',
        '    d = min(d, sdShard(p, 1.15,  0.33,  1.05, 4.4, vec3(0.035, 0.035, 0.035)));',
        '    return d;',
        '}',
        'vec3 calcNormal(vec3 p){',
        '    vec2 e = vec2(0.0015, 0.0);',
        '    return normalize(vec3(',
        '        map(p + e.xyy) - map(p - e.xyy),',
        '        map(p + e.yxy) - map(p - e.yxy),',
        '        map(p + e.yyx) - map(p - e.yyx)));',
        '}',

        'vec3 bgCol(vec3 rd){',
        '    float t = uTime * 0.02;',
        '    vec3 col = mix(vec3(0.0045, 0.006, 0.0065), vec3(0.0, 0.0, 0.0005), clamp(rd.y * 0.5 + 0.5, 0.0, 1.0));',
        '    col += vec3(0.008, 0.038, 0.044) * pow(max(0.0, 1.0 - abs(rd.y + 0.28) * 2.1), 3.0);',
        '    float n = fbm(rd.xy * 3.0 + vec2(t, -t * 0.6));',
        '    col += vec3(0.006, 0.014, 0.016) * n * pow(max(0.0, 1.0 - abs(rd.y) * 1.5), 2.0);',

        '    vec3 ed = normalize(vec3(-0.32, 0.45, -1.0));',
        '    float ad = length(rd - ed);',
        '    col *= 1.0 - 0.92 * smoothstep(0.155, 0.10, ad);',
        '    float ring = smoothstep(0.016, 0.002, abs(ad - 0.155));',
        '    col += vec3(0.30, 0.52, 0.56) * ring * (0.55 + 0.2 * sin(uTime * 0.23)) * 0.55;',
        '    col += vec3(0.035, 0.09, 0.10) * exp(-max(ad - 0.155, 0.0) * 16.0) * 0.4;',

        '    vec2 sp = rd.xy * 42.0;',
        '    vec2 si = floor(sp);',
        '    float star = step(0.9975, hash21(si));',
        '    float d = length(fract(sp) - 0.5);',
        '    float dot_ = smoothstep(0.09, 0.02, d);',
        '    float tw = 0.5 + 0.5 * sin(uTime * 2.0 + hash21(si) * 40.0);',
        '    col += vec3(0.5, 0.8, 0.85) * star * dot_ * tw * 0.14;',
        '    return col;',
        '}',

        'vec3 shade(vec3 p, vec3 n, vec3 rd){',
        '    vec3 q = toLocal(p);',
        '    vec3 ln = localDir(n);',
        '    float frontness = step(0.9, abs(ln.z));',

        '    vec2 fuv = (q.xy + vec2(0.58, 1.30)) / vec2(1.16, 2.60);',
        '    vec2 g = fuv * vec2(7.0, 16.0);',
        '    vec2 id = floor(g);',
        '    vec2 f = fract(g);',
        '    float sq = step(0.28, f.x) * step(f.x, 0.72) * step(0.28, f.y) * step(f.y, 0.72);',
        '    float inFace = step(abs(q.x), 0.58) * step(abs(q.y), 1.30);',
        '    float groove = sq * frontness * inFace;',

        '    float h = hash21(id + sign(ln.z) * 13.7);',
        '    float persistent = step(0.955, h);',
        '    float flick = step(0.996, hash21(id + floor(uTime * 2.0) * 0.37));',
        '    float pulse = 0.5 + 0.5 * sin(uTime * 1.4 + h * 30.0);',
        '    vec3 emissive = vec3(0.12, 0.75, 0.85) * (persistent * (0.22 + 0.45 * pulse) + flick * 1.6) * groove;',

        '    float seam = smoothstep(0.012, 0.002, abs(q.x)) * frontness * inFace;',
        '    emissive += vec3(0.10, 0.65, 0.75) * seam * (0.18 + 0.14 * sin(uTime * 0.7));',

        '    float ph = fract(uTime / 12.0);',
        '    float scanY = mix(-1.8, 1.8, clamp(ph / 0.22, 0.0, 1.0));',
        '    float scan = step(ph, 0.22) * exp(-abs(q.y - scanY) * 34.0);',
        '    emissive += vec3(0.10, 0.70, 0.80) * scan * 0.55;',

        '    vec3 alb = vec3(0.020, 0.023, 0.026) * (1.0 - groove * 0.55);',
        '    alb *= 0.75 + 0.5 * fbm(q.xy * 7.0 + q.z * 3.0);',
        '    vec3 L1 = normalize(vec3(0.5, 0.85, 0.45));',
        '    vec3 col = alb * (0.12 + 0.88 * max(dot(n, L1), 0.0)) * vec3(0.9, 0.95, 1.0);',
        '    vec3 L2 = normalize(vec3(-0.5, -0.6, 0.3));',
        '    col += alb * max(dot(n, L2), 0.0) * vec3(0.1, 0.5, 0.55) * 0.9;',

        '    vec3 re = reflect(rd, n);',
        '    vec3 env = bgCol(re) * 1.6;',
        '    float F = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);',
        '    col += env * (0.12 + 0.88 * F);',
        '    col += pow(max(dot(re, L1), 0.0), 64.0) * vec3(0.9, 1.0, 1.0) * 0.55;',
        '    col += emissive;',
        '    return col;',
        '}',

        'void main(){',
        '    vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;',
        '    uv -= uShift;',
        '    vec3 ro = vec3(uMouse.x * 0.12, 0.05 + uMouse.y * 0.08, uDist);',
        '    vec3 fw = normalize(-ro);',
        '    vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));',
        '    vec3 up = cross(rt, fw);',
        '    vec3 rd = normalize(fw * 1.75 + uv.x * rt + uv.y * up);',

        '    float t = 0.0;',
        '    float minD = 1e5;',
        '    bool hit = false;',
        '    for (int i = 0; i < 90; i++){',
        '        vec3 p = ro + rd * t;',
        '        float d = map(p);',
        '        minD = min(minD, d);',
        '        if (d < 0.0012){ hit = true; break; }',
        '        t += d * 0.92;',
        '        if (t > 14.0) break;',
        '    }',

        '    vec3 col;',
        '    if (hit){',
        '        vec3 p = ro + rd * t;',
        '        vec3 n = calcNormal(p);',
        '        col = shade(p, n, rd);',
        '        col = mix(col, bgCol(rd), 1.0 - exp(-0.008 * t * t));',
        '    } else {',
        '        col = bgCol(rd);',
        '        col += vec3(0.05, 0.20, 0.22) * exp(-minD * 9.0) * 0.30;',
        '    }',

        '    col = pow(1.0 - exp(-col * 2.4), vec3(0.62));',
        '    gl_FragColor = vec4(col, 1.0);',
        '}'
    ].join('\n');

    var POST_FRAG = [
        'precision highp float;',
        'uniform sampler2D uTex;',
        'uniform vec2 uRes;',
        'uniform float uTime;',
        'uniform float uGlitch;',

        'float hash11(float p){ p = fract(p * 443.8975); p *= p + 7.13; p *= p + p; return fract(p); }',
        'float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 443.897); p3 += dot(p3, p3.yzx + 19.19); return fract((p3.x + p3.y) * p3.z); }',

        'void main(){',
        '    vec2 uv = gl_FragCoord.xy / uRes;',
        '    float g = uGlitch;',
        '    vec2 duv = uv;',

        '    float band = floor(uv.y * (14.0 + 44.0 * hash11(floor(uTime * 8.0))));',
        '    float bh = hash21(vec2(band, floor(uTime * 24.0)));',
        '    if (bh < g * 0.4){',
        '        duv.x += (hash21(vec2(band, floor(uTime * 24.0) + 7.0)) - 0.5) * 0.08 * g;',
        '    }',

        '    float ca = 0.0011 + g * 0.004;',
        '    vec2 dir = duv - 0.5;',
        '    vec3 col;',
        '    col.r = texture2D(uTex, duv + dir * ca + vec2(g * 0.004, 0.0)).r;',
        '    col.g = texture2D(uTex, duv).g;',
        '    col.b = texture2D(uTex, duv - dir * ca - vec2(g * 0.004, 0.0)).b;',

        '    vec2 dp = vec2(uv.x * uRes.x / uRes.y, uv.y) * 22.0 + vec2(0.0, -uTime * 0.22);',
        '    vec2 di = floor(dp);',
        '    float ds = step(0.997, hash21(di));',
        '    float dd = length(fract(dp) - 0.5);',
        '    col += vec3(0.4, 0.7, 0.75) * ds * smoothstep(0.12, 0.03, dd) * 0.045 * (0.5 + 0.5 * sin(uTime + hash21(di) * 20.0));',

        '    col *= 0.965 + 0.035 * sin(duv.y * uRes.y * 2.6);',
        '    col += (hash21(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) * 0.028;',
        '    vec2 vv = uv * (1.0 - uv);',
        '    col *= pow(vv.x * vv.y * 15.0, 0.18);',
        '    col *= 0.992 + 0.008 * hash11(floor(uTime * 60.0) * 0.113);',
        '    gl_FragColor = vec4(col, 1.0);',
        '}'
    ].join('\n');

    function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(s));
        }
        return s;
    }
    function program(fragSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(p));
        }
        return p;
    }

    if (gl) {
        try {
            var sceneProg = program(SCENE_FRAG);
            var postProg = program(POST_FRAG);

            var quad = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quad);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

            function bindQuad(prog) {
                var loc = gl.getAttribLocation(prog, 'aPos');
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            }

            var fbo = gl.createFramebuffer();
            var tex = gl.createTexture();
            var W = 0, H = 0, SW = 0, SH = 0;

            function resize() {
                var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                if (window.innerWidth < 760) dpr = Math.min(dpr, 1.25);
                W = Math.floor(window.innerWidth * dpr);
                H = Math.floor(window.innerHeight * dpr);
                SW = Math.floor(W * 0.6);
                SH = Math.floor(H * 0.6);
                canvas.width = W;
                canvas.height = H;
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SW, SH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            }
            window.addEventListener('resize', resize);
            resize();

            var u = function (p, n) { return gl.getUniformLocation(p, n); };
            var sRes = u(sceneProg, 'uRes'), sTime = u(sceneProg, 'uTime'),
                sMouse = u(sceneProg, 'uMouse'), sShift = u(sceneProg, 'uShift'),
                sDist = u(sceneProg, 'uDist'), sTear = u(sceneProg, 'uTear');
            var pRes = u(postProg, 'uRes'), pTime = u(postProg, 'uTime'),
                pGlitch = u(postProg, 'uGlitch'), pTex = u(postProg, 'uTex');

            var mouse = { x: 0, y: 0 }, target = { x: 0, y: 0 };
            window.addEventListener('pointermove', function (e) {
                target.x = (e.clientX / window.innerWidth) * 2 - 1;
                target.y = -((e.clientY / window.innerHeight) * 2 - 1);
            });

            var glitch = 0;
            var nextGlitch = performance.now() + 6000;
            var simTime = 0;
            var last = performance.now();

            function frame(now) {
                var dt = Math.min((now - last) / 1000, 0.1);
                last = now;
                simTime += dt * (reduced ? 0.35 : 1.0);

                if (!reduced && now > nextGlitch) {
                    glitch = 0.18 + Math.random() * 0.22;
                    nextGlitch = now + 9000 + Math.random() * 14000;
                }
                glitch *= Math.pow(0.005, dt);
                var gOut = Math.max(glitch, reduced ? 0 : 0.008);

                mouse.x += (target.x - mouse.x) * 0.04;
                mouse.y += (target.y - mouse.y) * 0.04;

                var wide = window.innerWidth >= 760;
                var shiftX = wide ? 0.55 : 0.0;
                var shiftY = wide ? 0.0 : 0.42;
                var dist = (wide ? 3.5 : 6.4) + 0.18 * Math.sin(simTime * 0.07);

                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.viewport(0, 0, SW, SH);
                gl.useProgram(sceneProg);
                bindQuad(sceneProg);
                gl.uniform2f(sRes, SW, SH);
                gl.uniform1f(sTime, simTime);
                gl.uniform2f(sMouse, mouse.x, mouse.y);
                gl.uniform2f(sShift, shiftX, shiftY);
                gl.uniform1f(sDist, dist);
                gl.uniform1f(sTear, glitch * 0.6);
                gl.drawArrays(gl.TRIANGLES, 0, 3);

                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, W, H);
                gl.useProgram(postProg);
                bindQuad(postProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.uniform1i(pTex, 0);
                gl.uniform2f(pRes, W, H);
                gl.uniform1f(pTime, simTime);
                gl.uniform1f(pGlitch, gOut);
                gl.drawArrays(gl.TRIANGLES, 0, 3);

                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        } catch (err) {
            document.body.classList.add('no-webgl');
            canvas.style.display = 'none';
        }
    }

        );
    } catch (e) {}
})();
